name: kobolt

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]

  web:
    build: { context: .., dockerfile: deploy/Dockerfile }
    image: kobolt:latest
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://kobolt:${POSTGRES_PASSWORD}@db:5432/kobolt
      PORT: "3000"
    depends_on:
      db: { condition: service_healthy }

  bot:
    image: kobolt:latest
    restart: unless-stopped
    command: ["npx", "tsx", "bot/main.ts"]
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://kobolt:${POSTGRES_PASSWORD}@db:5432/kobolt
    depends_on: [web]
    profiles: ["bot"]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kobolt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kobolt
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kobolt"]
      interval: 5s
      retries: 20

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes: [../backups:/backups]
    entrypoint: ["/bin/sh", "-c", "while true; do pg_dump -h db -U kobolt kobolt | gzip > /backups/kobolt-$$(date +%Y%m%d-%H%M).sql.gz; sleep 3600; done"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pg:
  caddy_data:
  caddy_config:
